<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="cupGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="45%" stop-color="#fce1b4"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="teaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="50%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#26170e"/>
      <stop offset="100%" stop-color="#0f0703"/>
    </linearGradient>
    <filter id="steamGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @keyframes steamRise {
      0% {
        transform: translateY(0px) scaleX(1);
        opacity: 0.25;
      }
      50% {
        opacity: 0.95;
      }
      100% {
        transform: translateY(-6px) scaleX(1.15);
        opacity: 0.15;
      }
    }
    .steam-left {
      animation: steamRise 2.4s ease-in-out infinite;
      transform-origin: 24px 23px;
    }
    .steam-mid {
      animation: steamRise 2.0s ease-in-out infinite 0.3s;
      transform-origin: 32px 22px;
    }
    .steam-right {
      animation: steamRise 2.6s ease-in-out infinite 0.7s;
      transform-origin: 40px 23px;
    }
  </style>

  <!-- Badge Background for universal tab visibility (Dark & Light browser themes) -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect width="61" height="61" x="1.5" y="1.5" rx="14.5" fill="none" stroke="#fce1b4" stroke-opacity="0.3" stroke-width="1.5"/>

  <!-- Rising Steam / Smoke Plumes -->
  <g stroke="#fce1b4" stroke-width="2.5" stroke-linecap="round" fill="none" filter="url(#steamGlow)">
    <path class="steam-left" d="M 24 25 C 22 20 26 16 23 11" opacity="0.8"/>
    <path class="steam-mid" d="M 32 24 C 35 18 29 14 33 8" opacity="0.95"/>
    <path class="steam-right" d="M 40 25 C 38 20 42 16 39 12" opacity="0.8"/>
  </g>

  <!-- Saucer Plate -->
  <ellipse cx="32" cy="53" rx="19" ry="3.5" fill="#fce1b4" fill-opacity="0.2"/>
  <ellipse cx="32" cy="52" rx="16" ry="2.5" fill="#fce1b4" fill-opacity="0.9"/>

  <!-- Cup Handle -->
  <path d="M 40 36 C 49 36 49 47 40 48" fill="none" stroke="url(#cupGrad)" stroke-width="3" stroke-linecap="round"/>

  <!-- Cup Body -->
  <path d="M 19 33 C 19 33 21 49 26 51 C 29 52 35 52 38 51 C 43 49 45 33 45 33 Z" fill="url(#cupGrad)"/>

  <!-- Cup Rim & Hot Tea -->
  <ellipse cx="32" cy="33" rx="13" ry="3.5" fill="#fef3c7"/>
  <ellipse cx="32" cy="33.5" rx="11.5" ry="2.7" fill="url(#teaGrad)"/>

  <!-- Tea Surface Golden Rim Glow -->
  <path d="M 23 33.5 Q 32 35.5 41 33.5" fill="none" stroke="#fce1b4" stroke-width="1" stroke-linecap="round" opacity="0.7"/>
</svg>
